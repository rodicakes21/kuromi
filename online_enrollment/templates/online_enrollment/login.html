<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    {% load static %}
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1A0B1F; /* Dark purple Kuromi color */
            color: #FFE6F7;
            margin: 0;
            padding: 0;
        }

        .login-container {
            width: 400px;
            margin: 120px auto;
            padding: 35px;
            background: rgba(40, 15, 55, 0.7);
            border: 2px solid #FF8AD4; /* Kuromi pink */
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(255, 138, 212, 0.5);
            backdrop-filter: blur(6px);
            position: relative;
        }

        /* Kuromi Icon Centered */
        .kuromi-icon {
            width: 90px;
            display: block;
            margin: -80px auto 5px auto;
            filter: drop-shadow(0 0 10px #FF8AD4);
        }

        h1 {
            text-align: center;
            color: #FFB3E6;
            text-shadow: 0 0 12px #FF8AD4;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #2A103A;
            border: 1px solid #FF8AD4;
            border-radius: 8px;
            color: #FFE6F7;
            outline: none;
            font-size: 15px;
            box-shadow: 0 0 6px rgba(255, 138, 212, 0.3);
        }

        input:focus {
            border-color: #FF66C4;
            box-shadow: 0 0 15px #FF66C4;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #FF8AD4;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #3A0033;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px #FF8AD4;
        }

        button:hover {
            background: #FF66C4;
            box-shadow: 0 0 18px #FF66C4;
        }

        .error {
            color: #FF5F7E;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 5px #FF5F7E;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #FF8AD4;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            color: #FF66C4;
            text-shadow: 0 0 10px #FF66C4;
        }
    </style>
</head>
<body>

    <div class="login-container">



        <h1>Login to ClayHeart Academy</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <a href="{% url 'student_register' %}">Don't have an account? Register</a>
    </div>

</body>
</html>
