<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yunachen Profile</title>
    {% load static %}
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1A0B1F; /* Kuromi purple */
            color: #FFE6F7;
            margin: 40px;
        }

        /* Kuromi Icon */
        .kuromi-icon {
            width: 110px;
            display: block;
            margin: 0 auto 10px auto;
            filter: drop-shadow(0 0 12px #FF8AD4);
        }

        h1 {
            text-align: center;
            color: #FFB3E6;
            font-size: 42px;
            text-shadow: 0 0 15px #FF8AD4;
            margin-bottom: 30px;
        }

        .profile-card {
            width: 65%;
            margin: auto;
            padding: 30px;
            background: rgba(40, 15, 55, 0.7); 
            border: 2px solid #FF8AD4;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(255, 138, 212, 0.4);
            backdrop-filter: blur(6px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 20px;
        }

        th {
            text-align: left;
            padding: 14px;
            background: rgba(255, 138, 212, 0.2);
            border-bottom: 1px solid #FF8AD4;
            color: #FFB3E6;
            text-shadow: 0 0 6px #FF8AD4;
            width: 30%;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid rgba(255, 138, 212, 0.3);
        }

        a {
            display: block;
            width: max-content;
            margin: 35px auto;
            padding: 14px 35px;
            color: #3A0033;
            background: #FF8AD4;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            box-shadow: 0 0 15px #FF8AD4;
        }

        a:hover {
            background: #FF66C4;
            box-shadow: 0 0 20px #FF66C4;
        }
    </style>
</head>
<body>

    <!-- Kuromi Image -->
    <img class="kuromi-icon" src="{% static 'images/kuromi.jpg' %}" alt="Kuromi">

    <h1>MLBB Profile</h1>

    <div class="profile-card">
        <table>
            <tr><th>Student ID</th><td>{{ student.student_id }}</td></tr>
            <tr><th>First Name</th><td>{{ student.first_name }}</td></tr>
            <tr><th>Last Name</th><td>{{ student.last_name }}</td></tr>
            <tr><th>Date of Birth</th><td>{{ student.date_of_birth }}</td></tr>
            <tr><th>Email</th><td>{{ student.email }}</td></tr>
        </table>
    </div>

    <a href="{% url 'student_logout' %}">Logout</a>

</body>
</html>
