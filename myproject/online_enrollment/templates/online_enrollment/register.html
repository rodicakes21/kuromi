{% load static %}

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Register</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1A0B1F; /* Dark purple background */
            color: #FFE6F7;
            margin: 0;
            padding: 0;
        }

        .register-container {
            width: 430px;
            margin: 60px auto;
            padding: 30px;
            background: rgba(40, 15, 55, 0.7);
            border: 2px solid #FF8AD4; /* Kuromi pink border */
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(255, 138, 212, 0.5);
            backdrop-filter: blur(6px);
            position: relative;
        }

        /* Kuromi header image */
        .kuromi-icon {
            width: 90px;
            display: block;
            margin: -60px auto 10px auto;
            filter: drop-shadow(0 0 8px #FF8AD4);
        }

        h1 {
            text-align: center;
            color: #FFB3E6;
            text-shadow: 0 0 12px #FF8AD4;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
            color: #FFB3E6;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #2A103A;
            border: 1px solid #FF8AD4;
            border-radius: 8px;
            color: #FFE6F7;
            outline: none;
            font-size: 15px;
            box-shadow: 0 0 6px rgba(255, 138, 212, 0.3);
        }

        input:focus {
            border-color: #FF66C4;
            box-shadow: 0 0 15px #FF66C4;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #FF8AD4;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #3A0033;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 12px #FF8AD4;
        }

        button:hover {
            background: #FF66C4;
            box-shadow: 0 0 16px #FF66C4;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #FF8AD4;
            text-decoration: none;
        }

        a:hover {
            color: #FF66C4;
            text-shadow: 0 0 10px #FF66C4;
        }

        .error {
            color: #FF5F7E;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="register-container">

        <div style="text-align: center;">
    <img src="{% static 'images/kuromi.jpeg' %}" alt="Kuromi" width="150">
</div>




        <h1>Register to Yunachen</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>

            <label>Student ID</label>
            <input type="text" name="student_id" required>

            <label>First Name</label>
            <input type="text" name="first_name" required>

            <label>Last Name</label>
            <input type="text" name="last_name" required>

            <!-- ⭐ Added Date of Birth Label -->
            <label>Date of Birth</label>
            <input type="date" name="date_of_birth" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <button type="submit">Register</button>
        </form>

        <a href="{% url 'student_login' %}">Already have an account? Login</a>
    </div>

</body>
</html>
